services:
  engine:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      SEC_USER_AGENT: ${SEC_USER_AGENT:?Set SEC_USER_AGENT in .env}
      FINENGINE_API_KEY: ${FINENGINE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      FINENGINE_SCHEDULE_SECONDS: ${FINENGINE_SCHEDULE_SECONDS:-21600}
      FINENGINE_SOURCE_LIMIT: ${FINENGINE_SOURCE_LIMIT:-50}
      FINENGINE_BROWSER_HEADLESS: ${FINENGINE_BROWSER_HEADLESS:-false}
      FINENGINE_STATE_DIR: /app/state
      FINENGINE_DB: /app/state/financial.sqlite3
      FINENGINE_RAW_DIR: /app/state/raw
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${FINENGINE_STATE_DIR:-./runtime}:/app/state
      - ${FINENGINE_SEED_RAW_DIR:-./data/raw}:/app/data/raw:ro
    init: true

  backup:
    build: .
    restart: unless-stopped
    command: ["/app/deploy/backup-loop.sh"]
    environment:
      FINENGINE_DB: /app/state/financial.sqlite3
      FINENGINE_BACKUP_DIR: /app/backups
      FINENGINE_BUNDLE_KEEP: ${FINENGINE_BUNDLE_KEEP:-7}
      FINENGINE_BACKUP_SECONDS: ${FINENGINE_BACKUP_SECONDS:-86400}
      FINENGINE_BACKUP_RETRY_SECONDS: ${FINENGINE_BACKUP_RETRY_SECONDS:-900}
      FINENGINE_BACKUP_STATUS_FILE: /app/backups/backup-status.json
    volumes:
      - ${FINENGINE_STATE_DIR:-./runtime}:/app/state:ro
      - ${FINENGINE_BACKUP_DIR:-./backups}:/app/backups
      - ${FINENGINE_SEED_RAW_DIR:-./data/raw}:/app/data/raw:ro
    healthcheck:
      test: ["CMD-SHELL", "test -s /app/backups/backup-status.json && grep -q '\"state\": \"ready\"' /app/backups/backup-status.json"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    depends_on:
      engine:
        condition: service_healthy
    init: true
  universe-refresh:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      SEC_USER_AGENT: ${SEC_USER_AGENT:?Set SEC_USER_AGENT in .env}
      FINENGINE_UNIVERSE_REFRESH_SECONDS: ${FINENGINE_UNIVERSE_REFRESH_SECONDS:-86400}
      FINENGINE_DB_PATH: /app/state/financial.sqlite3
      FINENGINE_UNIVERSE_RAW_DIR: /app/state/raw/universe
    command: ["/app/deploy/refresh-universe.sh"]
    volumes:
      - ${FINENGINE_STATE_DIR:-./runtime}:/app/state
    depends_on:
      engine:
        condition: service_healthy
    init: true
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  telegram:
    build: .
    profiles: ["telegram"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    command: ["finengine", "--db", "/app/state/financial.sqlite3", "telegram"]
    volumes:
      - ${FINENGINE_STATE_DIR:-./runtime}:/app/state:ro
    depends_on:
      engine:
        condition: service_healthy
    init: true

  supabase-publisher:
    build: .
    profiles: ["supabase"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
      FINENGINE_SUPABASE_SYNC_SECONDS: ${FINENGINE_SUPABASE_SYNC_SECONDS:-300}
      FINENGINE_DB: /app/state/financial.sqlite3
      FINENGINE_REGISTRY: /app/config/companies.json
    command: ["/app/deploy/sync-supabase.sh"]
    volumes:
      - ${FINENGINE_STATE_DIR:-./runtime}:/app/state:ro
    depends_on:
      engine:
        condition: service_healthy
    init: true
