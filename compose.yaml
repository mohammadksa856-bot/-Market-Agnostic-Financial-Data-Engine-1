services:
  engine:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      SEC_USER_AGENT: ${SEC_USER_AGENT:?Set SEC_USER_AGENT in .env}
      FINENGINE_API_KEY: ${FINENGINE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      FINENGINE_SCHEDULE_SECONDS: ${FINENGINE_SCHEDULE_SECONDS:-21600}
      FINENGINE_SOURCE_LIMIT: ${FINENGINE_SOURCE_LIMIT:-50}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    init: true

  backup:
    build: .
    restart: unless-stopped
    command: ["sh", "-c", "while true; do finengine --db /app/data/financial.sqlite3 backup-bundle --output-dir /app/backups/bundles --project-root /app --keep $${FINENGINE_BUNDLE_KEEP:-7}; sleep $${FINENGINE_BACKUP_SECONDS:-86400}; done"]
    environment:
      FINENGINE_BACKUP_KEEP: ${FINENGINE_BACKUP_KEEP:-14}
      FINENGINE_BUNDLE_KEEP: ${FINENGINE_BUNDLE_KEEP:-7}
      FINENGINE_BACKUP_SECONDS: ${FINENGINE_BACKUP_SECONDS:-86400}
    volumes:
      - ./data:/app/data:ro
      - ./backups:/app/backups
    depends_on:
      engine:
        condition: service_healthy
    init: true

  universe-refresh:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      SEC_USER_AGENT: ${SEC_USER_AGENT:?Set SEC_USER_AGENT in .env}
      FINENGINE_UNIVERSE_REFRESH_SECONDS: ${FINENGINE_UNIVERSE_REFRESH_SECONDS:-86400}
    command: ["/app/deploy/refresh-universe.sh"]
    volumes:
      - ./data:/app/data
    depends_on:
      engine:
        condition: service_healthy
    init: true

  telegram:
    build: .
    profiles: ["telegram"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    command: ["finengine", "--db", "/app/data/financial.sqlite3", "telegram"]
    volumes:
      - ./data:/app/data:ro
    depends_on:
      engine:
        condition: service_healthy
    init: true
