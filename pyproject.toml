[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-agnostic-financial-data-engine"
version = "0.5.0"
description = "Auditable SA/US financial filings pipeline"
requires-python = ">=3.11"

[project.scripts]
finengine = "finengine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
