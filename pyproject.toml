[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-agnostic-financial-data-engine"
version = "1.2.0"
description = "Auditable SA/US financial filings pipeline"
requires-python = ">=3.11"

[project.optional-dependencies]
# The reader agent (`finengine read`) parses filed PDFs. The core engine and
# every other command stay dependency-free.
reader = ["pymupdf>=1.24"]

[project.scripts]
finengine = "finengine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
