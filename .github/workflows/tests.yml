name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[reader]"
      - run: python -m unittest discover -s tests -v
      - run: finengine --db data/financial.sqlite3 verify --imports data/imports
      - run: finengine --db /tmp/financial-ci.sqlite3 bootstrap --raw-dir /tmp/financial-ci-raw --html /tmp/financial-report.html --csv /tmp/financial-data.csv
      - run: finengine --db /tmp/financial-ci.sqlite3 audit --project-root . --strict-warnings
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build --tag finengine:test .
