name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[reader]"
      - run: python -m unittest discover -s tests -v
      - run: finengine --db data/financial.sqlite3 verify --imports data/imports
      - run: finengine --db data/financial.sqlite3 audit --project-root . --strict-warnings
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag finengine:test .
