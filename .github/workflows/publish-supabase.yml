name: publish-supabase

on:
  workflow_run:
    workflows: [tests]
    types: [completed]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: supabase-production-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.SUPABASE_PUBLISH_ENABLED == 'true' &&
       (github.event_name == 'schedule' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'main')))
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[reader]"
      - name: Rebuild reviewed production snapshot
        run: >-
          finengine --db /tmp/financial-publish.sqlite3 bootstrap
          --imports data/imports --registry config/companies.json
          --raw-dir data/raw --html /tmp/financial-report.html
          --csv /tmp/financial-data.csv
      - name: Enforce release audit
        run: >-
          finengine --db /tmp/financial-publish.sqlite3 audit
          --project-root . --strict-warnings
      - name: Publish current facts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: >-
          finengine --db /tmp/financial-publish.sqlite3 export-supabase
          --all --registry config/companies.json --prune
